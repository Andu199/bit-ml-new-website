baseURL = "https://andu199.github.io/bit-ml-new-website/"
languageCode = "en-us"
title = "Bitdefender AI Research"
theme = "PaperMod"

# Allow raw HTML in markdown (e.g. <div class="course-entries-grid"> on community page)
[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Engaging with the broader AI Community."
  defaultTheme = "light"

  # Home page: image, title, short text, and links (R1)
  [params.profileMode]
    enabled = true
    title = "Bitdefender AI Research"
    subtitle = "Welcome to our research team's website. We work on artificial intelligence and engage with the broader community."
    imageUrl = "img/hero_avatar.webp"
    imageTitle = "Team"
    imageWidth = 960
    imageHeight = 400

  # Only "news" section feeds the home list (we use profileMode so home shows custom content)
  mainSections = ["news"]

[services.googleAnalytics]
  id = "G-XXXXXXXXXX"

[privacy.googleAnalytics]
  disable = false
  respectDoNotTrack = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "News"
    url = "/news/"
    weight = 2
  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 3
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 4
  [[menu.main]]
    name = "Community"
    url = "/community/"
    weight = 5
  [[menu.main]]
    name = "Team"
    url = "/team/"
    weight = 6
